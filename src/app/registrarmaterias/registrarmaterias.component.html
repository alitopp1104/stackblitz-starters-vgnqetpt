  >
    <img
      src="https://st.mextudia.com/wp-content/uploads/2022/07/UNPA_logo.jpg"
      style="width: 130px; height: auto;"
    />

    <div style="text-align: right; line-height: 0.8;">
      <p class="custom-font fs-3 text-muted-teal fw-normal text-adjust">
        UNIVERSIDAD DEL PAPALOAPAN
      </p>
      <p
        class="custom-font caveat fs-3 text-muted-teal text-adjust"
        style="line-height: 0.8;"
      >
        Terra Ubérrima, Mens Aperta
      </p>
      <p
        class="custom-font fs-3 text-muted-teal fw-normal text-adjust"
        style="line-height:0.8;"
      >
        Loma Bonita, Oaxaca
      </p>

  <nav class="navbar navbar-expand-lg" style="background-color: #16a085;">

      <a class="navbar-brand" href="#">Navbar</a>

        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"

        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>

            <a class="nav-link" href="#">Link</a>
          </li>

              class="nav-link dropdown-toggle"

              aria-expanded="false"
            >
              Dropdown

              <li><a class="dropdown-item" href="#">Action</a></li>

  <br />
  <h2 style="margin-bottom: 40px;">Registrar materias</h2>

  <form action="">
    <div class="form-group">
      <div>
        <label for="">Asignatura:</label>
        <input type="text" />
      </div>
      <div>
        <label for="">Carrera:</label>
        <select
          class="form-select form-select-sm"
          aria-label="Small select example"
        >
          <option value="">Ing. Computación</option>
          <option value="">Ing. Agronomía</option>
          <option value="">Ing. Diseño</option>
          <option value="">Ing. Mecatrónica</option>
          <option value="">Ing. Ciencia de datos y matemáticas</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <div>
        <label for="">Semestre:</label>
        <select
          class="form-select form-select-sm"
          aria-label="Small select example"
        >
          <option value="">Primero</option>
          <option value="">Segundo</option>
          <option value="">Tercero</option>
          <option value="">Cuarto</option>
          <option value="">Quinto</option>
          <option value="">Sexto</option>
          <option value="">Séptimo</option>
          <option value="">Octavo</option>
          <option value="">Noveno</option>
          <option value="">Décimo</option>
        </select>
      </div>
      <div>
        <label for="">Ciclo escolar:</label>
        <select
          class="form-select form-select-sm"
          aria-label="Small select example"
        >
          <option value="">2002-2003 A</option>
          <option value="">2002-2003 B</option>
          <option value="">2002-2003 V</option>
          <option value="">2004-2005 A</option>
          <option value="">2004-2005 B</option>
          <option value="">2004-2005 V</option>
          <option value="">2006-2007 A</option>
          <option value="">2006-2007 B</option>
          <option value="">2006-2007 V</option>
          <option value="">2008-2009 A</option>
          <option value="">2008-2009 B</option>
          <option value="">2008-2009 V</option>
          <option value="">2010-2011 A</option>
          <option value="">2010-2011 B</option>
          <option value="">2010-2011 V</option>
          <option value="">2012-2013 A</option>
          <option value="">2012-2013 B</option>
          <option value="">2012-2013 V</option>
          <option value="">2014-2015 A</option>
          <option value="">2014-2015 B</option>
          <option value="">2014-2015 V</option>
          <option value="">2016-2017 A</option>
          <option value="">2016-2017 B</option>
          <option value="">2016-2017 V</option>
          <option value="">2018-2019 A</option>
          <option value="">2018-2019 B</option>
          <option value="">2018-2019 V</option>
          <option value="">2020-2021 A</option>
          <option value="">2020-2021 B</option>
          <option value="">2020-2021 V</option>
          <option value="">2022-2023 A</option>
          <option value="">2022-2023 B</option>
          <option value="">2022-2023 V</option>
          <option value="">2024-2025 A</option>
          <option value="">2024-2025 B</option>
          <option value="">2024-2025 V</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <div>
        <label for="">Horas/Semanas:</label>
        <input type="text" value="5" />
      </div>
      <div>
        <label for="numAlumnos">Número de alumnos:</label>
        <select
          class="form-select form-select-sm"
          aria-label="Small select example"
        >
          <option selected>Open this select menu</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
      </div>
    </div>

    <div class="btn-container">
      <button type="button" class="btn">Registrar</button>
    </div>
  </form>
</div>

<h1>Materias Impartidas</h1>

<form [formGroup]="frm" (ngSubmit)="onSubmit()">
  Valor A:
  <input id="valorA" type="text" formControlName="valorA" />

  Valor B:
  <input id="valorB" type="text" formControlName="valorB" />

  <button class="button" type="submit">Enviar</button>
</form>
